name: 묵상 자동 가져오기 (매일)

on:
  schedule:
    # 동부시간 07:05, 서머타임 자동 반영. 뒤의 두 일정은 누락분 복구용입니다.
    - cron: '5,35 7 * * *'
      timezone: America/New_York
    - cron: '5 8 * * *'
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: devotion-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install google-genai

      - name: 가져오기
        id: import
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: imap.gmail.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TIMEZONE: America/New_York
          GEMINI_BUDGET: '18'
        run: python -u importer.py --collection tozer --require-today

      - name: 커밋
        # 일부를 저장한 뒤 실패했어도 저장된 글은 보존하고 실행은 실패로 남깁니다.
        if: ${{ !cancelled() && steps.import.outcome != 'skipped' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meditations/
          if git diff --cached --quiet; then
            echo "새로 저장된 묵상이 없습니다."
            exit 0
          fi
          git commit -m "묵상 자동 등록 ($(TZ=America/New_York date +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
